# 配置片段：合并到 Quantumult X 现有对应分区。
# 脚本通过 GitHub Raw 地址加载。

[rewrite_local]
^https:\/\/(?:www\.)?(?:pting\.club|fengchao\.chat)\/api\/(?:auth\/me|check-in)(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/pting_checkin.js

[task_local]
14 9 * * * https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/pting_checkin.js, tag=蜂巢签到, enabled=true

[mitm]
# 把以下域名追加到现有 hostname 列表，并启用 MitM。
hostname = pting.club, www.pting.club, fengchao.chat, www.fengchao.chat
