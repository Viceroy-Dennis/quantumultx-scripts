# 淘金币本机采集 / 待适配执行器配置片段
# 下列规则直接使用 GitHub raw 脚本，默认用于采集诊断。
# 如需修改 CONFIG，将脚本存入 Quantumult X/Scripts，并把四处 raw 地址替换为 taobao_coin.js。
# 把以下内容合并到现有同名段落，保留原有配置。

[rewrite_local]
# GET 与 POST 请求规则互斥；响应通过 sessionIndex 关联。
# 脚本内部仅处理 coingame/taocoin/coin/bgc 或 CONFIG.api 指定的 API。
^https://(h5api\.m\.taobao\.com|h5api\.m\.tmall\.com|acs\.m\.taobao\.com)/(h5|gw)/mtop\. ^GET\s url-and-header script-request-header https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/taobao_coin.js
^https://(h5api\.m\.taobao\.com|h5api\.m\.tmall\.com|acs\.m\.taobao\.com)/(h5|gw)/mtop\. ^POST\s url-and-header script-request-body https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/taobao_coin.js
^https://(h5api\.m\.taobao\.com|h5api\.m\.tmall\.com|acs\.m\.taobao\.com)/(h5|gw)/mtop\. url script-response-body https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/taobao_coin.js

[task_local]
# 默认关闭；先在任务编辑器手动运行查看诊断，完成真实接口适配后再启用。
# cron 按手机的本地时区调度；脚本的每日重复检查按北京时间计算。
14 9 * * * https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/taobao_coin.js, tag=淘宝淘金币, enabled=false

[mitm]
# 如果已有 hostname，把以下三个域名追加进去，勿覆盖原有域名列表。
hostname = h5api.m.taobao.com, h5api.m.tmall.com, acs.m.taobao.com
