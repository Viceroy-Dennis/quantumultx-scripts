; 蜗牛 I 4K（wn4k.com）抓 Cookie 重写资源 · Linda for Dennis
;
; 抓包原理：站点是 MacCMS V10，登录后会把 user_id / user_name / user_check 写进 Cookie，
; 脚本在「会员中心」的请求里读到这串东西，就按账号分桶存起来。
;
; 用法（多账号就是一个账号抓一次）：
;   1. 浏览器打开 wn4k.com，登录账号 A
;   2. 进「会员中心」任意页面（/user/index.html 之类），Cookie 自动存进 A 的桶
;   3. 退出登录，换账号 B 重复 1-2 步
;   4. 之后每天 09:14 自动给所有抓到的账号签到
;
; 前提：Quantumult X 已开启 MITM 并安装了证书，否则读不到 Cookie。

[rewrite_local]
^https?:\/\/(www\.)?wn4k\.com\/user\/ url script-request-header https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/wn4k.qx.checkin.js

[mitm]
hostname = wn4k.com, www.wn4k.com
