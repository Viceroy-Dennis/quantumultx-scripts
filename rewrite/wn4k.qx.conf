; 蜗牛 I 4K（wn4k.com）抓 Cookie 重写资源 · Linda for Dennis
;
; 两条路一起兜，抓到就是抓到了：
;   ① 登录响应：POST /user/login.html 的响应头里就有 Set-Cookie，
;      登录成功那一刻就存下来，不用再点别的页面。
;   ② 普通请求：顺手从 /user/ 下的请求头 Cookie 里捞，多一层保险。
;
; 抓包原理：站点是 MacCMS V10，登录后会把 user_id / user_name / user_check 写进 Cookie，
; 脚本读到这串东西，就按账号分桶存起来。
;
; 用法（多账号就是一个账号抓一次）：
;   1. 浏览器打开 wn4k.com，登录账号 A（登录成功就抓到了，不用再点）
;   2. 退出登录，换账号 B 重复第 1 步
;   3. 之后每天 09:14 自动给所有抓到的账号签到
;
; 前提：Quantumult X 已开启 MITM 并安装了证书，否则读不到任何东西。

[rewrite_local]
^https?:\/\/(www\.)?wn4k\.com\/user\/login url script-response-header https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/wn4k.qx.checkin.js
^https?:\/\/(www\.)?wn4k\.com\/user\/(?!login) url script-request-header https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/wn4k.qx.checkin.js

[mitm]
hostname = wn4k.com, www.wn4k.com
