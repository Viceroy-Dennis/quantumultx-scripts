; 蜗牛 I 4K（wn4k.com）抓 Cookie · Quantumult X 重写资源
; 用法：QX → 设置 → 资源 → 添加资源 → 类型「重写」→ 填下面的 raw 地址
; hostname 那一行会自动把 wn4k.com 追加进 MITM 主机名，不用手动加
; 多账号：一个账号登录一次就抓一个，换账号再登录一次
hostname = wn4k.com, www.wn4k.com
^https?://(www\.)?wn4k\.com/user/login url script-response-header https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/wn4k.qx.checkin.js
^https?://(www\.)?wn4k\.com/user/ url script-request-header https://raw.githubusercontent.com/Viceroy-Dennis/quantumultx-scripts/main/scripts/wn4k.qx.checkin.js
